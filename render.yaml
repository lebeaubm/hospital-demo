services:
  # Backend API
  - type: web
    name: hospital-demo-api
    runtime: python
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn backend.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: APPLICATION_ENCRYPTION_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: hospital-demo-api.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://hospital-demo-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://hospital-demo-frontend.onrender.com,https://hospital-demo-portal.onrender.com,https://peacelovinghomehealth.org,https://www.peacelovinghomehealth.org,https://portal.peacelovinghomehealth.org
      - key: PAYMENT_DEMO_MODE
        value: false
      - key: SEED_DEMO_DATA
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-demo-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
    autoDeploy: true

  # Frontend Static Site
  - type: web
    name: hospital-demo-frontend
    runtime: static
    rootDir: frontend
    domains:
      - peacelovinghomehealth.org
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://hospital-demo-api.onrender.com
      - key: VITE_SITE_ROLE
        value: marketing
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true

  # Patient and Staff Portal Static Site
  - type: web
    name: hospital-demo-portal
    runtime: static
    rootDir: frontend
    domains:
      - portal.peacelovinghomehealth.org
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://hospital-demo-api.onrender.com
      - key: VITE_SITE_ROLE
        value: portal
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true

databases:
  # PostgreSQL Database
  - name: hospital-demo-db
    databaseName: hospital_demo
    user: hospital_demo_user
