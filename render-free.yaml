# Render Free Tier Configuration
# This is a simpler setup for FREE deployment
# Only deploys backend - deploy frontend to Netlify (free)

services:
  # Backend API (FREE TIER)
  - type: web
    name: hospital-demo-api
    runtime: python
    rootDir: backend
    plan: free  # ← FREE TIER
    buildCommand: ./build.sh
    startCommand: gunicorn backend.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-demo-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
    autoDeploy: true

databases:
  # PostgreSQL Database (FREE TIER)
  - name: hospital-demo-db
    databaseName: hospital_demo
    user: hospital_demo_user
    plan: free  # ← FREE TIER (1GB limit, 90 days)
